name: game_2048
description: 2048 Puzzle Game - slide and merge tiles to reach 2048!
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appstore.png"
  adaptive_icon_background: "#EDAA5C"
  adaptive_icon_foreground: "assets/icons/appstore.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#EDAA5C"
  image: assets/icons/appstore.png
  color_dark: "#2C1A0E"
  image_dark: assets/icons/appstore.png
  android: true
  ios: true
  android_12:
    image: assets/icons/appstore.png
    icon_background_color: "#EDAA5C"
    image_dark: assets/icons/appstore.png
    icon_background_color_dark: "#2C1A0E"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/